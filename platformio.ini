; =============================================================================
;  CatMat Gateway – Lola OS
;  Hardware: ESP32-WROOM-32U DevKit C (klassischer ESP32, externe Antenne)
;
;  Environments:
;    gateway    – Repeater "CatMat-EXT" + BLE->MQTT-Gateway + Kippy-Scanner
;    mat_probe  – Diagnose-Firmware: misst Sendeintervall, GATT-Aufbau und
;                 Verbindungsparameter der BLE-Katzenmatte.
;
;  Versionen sind bewusst fest eingetragen (siehe Lela-Projekt: keine
;  ungeplanten Library-Updates).
; =============================================================================

[platformio]
default_envs = gateway

; --- Gemeinsame Basis fuer alle Environments ---------------------------------
[env]
platform      = espressif32@6.12.0          ; Arduino-ESP32 Core 2.0.17
board         = esp32dev
framework     = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -I src/config
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1

; --- Produktiv-Firmware --------------------------------------------------------
[env:gateway]
build_src_filter = -<*> +<gateway/>
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@2.8

; --- Diagnose-Firmware fuer die Matte ----------------------------------------
[env:mat_probe]
build_src_filter = -<*> +<probe/>
